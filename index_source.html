function formState(){const closed=serverClosed||Date.now()>expires;byId("controls").disabled=closed||busy||confirmed;byId("deadline").textContent=closed?t.closed:t.by.replace("{date}",dateText(WEDDING.deadline));byId("number").textContent=seats;byId("minus").disabled=seats<=1;byId("plus").disabled=seats>=limit;byId("countRow").hidden=!attending();byId("send").querySelector("span").textContent=busy?t.sending:t.send;byId("status").textContent=t[feedback]||"";byId("wa").hidden=feedback!=="draft"||closed;if(feedback==="draft")byId("wa").href=replyUrl()}
byId("minus").onclick=()=>{seats=Math.max(1,seats-1);feedback="";formState()};byId("plus").onclick=()=>{seats=Math.min(limit,seats+1);feedback="";formState()};byId("form").addEventListener("input",()=>{feedback="";byId("guest").setCustomValidity("");formState()});
function replyUrl(){const text=[t.reply+" · "+names(),byId("guest").value.trim(),attending()?t.accept:t.decline,attending()?t.guests+" · "+seats:"",byId("wish").value.trim()].filter(Boolean).join("\n");return "https://wa.me/"+WEDDING.whatsapp.replace(/\D/g,"")+"?text="+encodeURIComponent(text)}
let submissionId;function getID(){if(!submissionId){const key="ivory-rsvp-"+WEDDING.date+"-"+byId("guest").value.trim();try{submissionId=sessionStorage.getItem(key)}catch{}if(!submissionId){submissionId=Array.from(crypto.getRandomValues(new Uint8Array(16)),n=>n.toString(16).padStart(2,"0")).join("");try{sessionStorage.setItem(key,submissionId)}catch{}}}return submissionId}
byId("form").onsubmit=async e=>{
  e.preventDefault();if(busy||confirmed||serverClosed||Date.now()>expires||byId("honeypot").value){formState();return}
  if(!byId("guest").value.trim()){byId("guest").setCustomValidity(t.invalid);byId("guest").reportValidity();return}
  if(!WEDDING.rsvpEndpoint){feedback="draft";formState();byId("wa").focus();return}
  busy=true;formState();const cancel=new AbortController(),timer=setTimeout(()=>cancel.abort(),12000);
  try{const id=getID(),data=new URLSearchParams({id,name:byId("guest").value.trim(),guests:String(attending()?seats:0),attending:attending()?"yes":"no",message:byId("wish").value.trim(),website:""});
    const res=await fetch(WEDDING.rsvpEndpoint,{method:"POST",body:data,signal:cancel.signal,credentials:"omit"});const body=await res.json();
    if(body.reason==="closed"){serverClosed=true;feedback="";return}if(!res.ok||body.ok!==true||body.id!==id)throw Error("Unconfirmed");
    confirmed=true;feedback="saved"
  }catch{feedback="draft"}finally{clearTimeout(timer);busy=false;formState()}
};
byId("guest").value=guestName;translate(lang);petals();setInterval(tick,1000);



/* The supplied Sansala face uses FM keyboard encoding, not Unicode.
   Keep all source strings, accessible text, form values and outgoing messages in
   Unicode. Only the aria-hidden display layer uses the original font's glyphs.
   FM code points cross-checked against the font and UCSC/Malinthe's mapping:
   https://gist.github.com/nipunadodan/92f4fac6608ff084c6367a317d1d3a1e */
const SANSALA_BASE={අ:'w',ආ:'wd',ඇ:'we',ඈ:'wE',ඉ:'b',ඊ:'B',උ:'W',ඌ:'W!',ඍ:'R',එ:'t',ඒ:'ta',ඓ:'ft',ඔ:'T',ඕ:'´',ඖ:'T!',ක:'l',ඛ:'L',ග:'.',ඝ:'>',ඞ:'X',ඟ:'Õ',ච:'p',ඡ:'P',ජ:'c',ඣ:'CO',ඤ:'[',ඥ:'{',ඦ:'`c',ට:'g',ඨ:'G',ඩ:'v',ඪ:'V',ණ:'K',ඬ:'~',ත:';',ථ:':',ද:'o',ධ:'O',න:'k',ඳ:'|',ප:'m',ඵ:'M',බ:'n',භ:'N',ම:'u',ඹ:'U',ය:'h',ර:'r',ල:',',ව:'j',ශ:'Y',ෂ:'I',ස:'i',හ:'y',ළ:'<',ෆ:'*','ං':'x','ඃ':'#'};
const SANSALA_FORMS={
 'ි':{ද:'È',ඳ:'¢',ඨ:'À',ඛ:'Å',ච:'Ñ',ර:'ß',ට:'á',ඩ:'ä',ඬ:'ç',ධ:'ê',ථ:'Ó',බ:'ì',ජ:'ð',ම:'ñ',ඹ:'ô',ව:'ú',ඡ:'ý',ණ:'‚'},
 'ී':{ද:'§',ඳ:'£',ඨ:'Á',ඡ:'Â',ඛ:'Ç',ර:'Í',ඪ:'Î',ථ:'Ò',ජ:'Ô',ච:'Ö',ඵ:'Ú',ට:'à',ඩ:'ã',ඬ:'é',ධ:'ë',බ:'î',ම:'ó',ඹ:'ö',ව:'ù',ණ:'Œ'},
 'ු':{ක:'l=',ග:'.=',ත:';=',ශ:'Y=',භ:'N=',ර:'re',ල:'¨',ළ:'¿',ද:'ÿ',ඳ:'÷'},
 'ූ':{ක:'l+',ග:'.+',ත:';+',ශ:'Y+',භ:'N+',ර:'rE',ල:'Æ',ද:'¥',ඳ:'ª'},
 '්':{ර:'¾',ඛ:'Ä',ච:'É',ජ:'Ê',ට:'Ü',ඩ:'â',ඬ:'å',ධ:'è',බ:'í',ම:'ï',ඹ:'ò',ව:'õ',ඡ:'þ'}
};
function sansalaWord(word){
 const source=word.normalize('NFC').replace(/[\u200c\u200d]/g,'');
 let out='';
 for(let i=0;i<source.length;i++){
  const c=source[i];let glyph=SANSALA_BASE[c];if(!glyph)return null;
  let conjunct='';
  if(source[i+1]==='්'&&/[රය]/.test(source[i+2]||'')&&c!=='ර'){
   conjunct=source[i+2]==='ර'?'%':'H';i+=2;
  }else if(c==='ක'&&source.slice(i+1,i+3)==='්ෂ'){glyph='Ì';i+=2}
  const mark=source[i+1];
  if(mark&&/[ාැෑිීුූෘෲෙේෛොෝෞ්]/.test(mark)){
   i++;
   if(!conjunct&&SANSALA_FORMS[mark]?.[c]){out+=SANSALA_FORMS[mark][c];continue}
   if(c==='ර'&&(mark==='ැ'||mark==='ෑ')){out+=mark==='ැ'?'/':'?';continue}
   if(mark==='ෙ')glyph='f'+glyph+conjunct;
   else if(mark==='ේ')glyph='f'+(SANSALA_FORMS['්'][c]||glyph+'a')+conjunct;
   else if(mark==='ෛ')glyph='ff'+glyph+conjunct;
   else if(mark==='ො'||mark==='ෝ'||mark==='ෞ')glyph='f'+glyph+conjunct+({'ො':'d','ෝ':'da','ෞ':'!'})[mark];
   else glyph+=conjunct+({'ා':'d','ැ':'e','ෑ':'E','ි':'s','ී':'S','ු':'q','ූ':'Q','ෘ':'D','ෲ':'DD','්':'a'})[mark];
  }else glyph+=conjunct;
  out+=glyph;
 }
 return out;
}
function paintSansala(root=document.body){
 // Only the visual hint is legacy encoded; editable values stay Unicode.
 const nameField=document.getElementById('guest');
 if(nameField&&document.documentElement.lang==='si')nameField.placeholder=COPY.si.nameHint.replace(/[\u0d80-\u0dff\u200c\u200d]+/g,w=>sansalaWord(w)||w);
 const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(node){
  return /[\u0d80-\u0dff]/.test(node.data)&&!node.parentElement.closest('script,style,svg,textarea,input,.sansalaWord')?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT;
 }}),nodes=[];
 while(walker.nextNode())nodes.push(walker.currentNode);
 for(const node of nodes){
  const parts=node.data.split(/([\u0d80-\u0dff\u200c\u200d]+)/g),fragment=document.createDocumentFragment();
  for(const part of parts){
   const encoded=/[\u0d80-\u0dff]/.test(part)?sansalaWord(part):null;
   if(encoded===null){fragment.append(document.createTextNode(part));continue}
   const wrap=document.createElement('span'),accessible=document.createElement('span'),visual=document.createElement('span');
   wrap.className='sansalaWord';accessible.className='unicodeText';accessible.textContent=part;
   visual.className='sansalaVisual';visual.setAttribute('aria-hidden','true');visual.textContent=encoded;
   wrap.append(accessible,visual);fragment.append(wrap);
  }
  node.replaceWith(fragment);
 }
}
// A single observer also covers validation, countdown completion and language swaps.
const sansalaObserver=new MutationObserver(()=>{sansalaObserver.disconnect();paintSansala();observeSansala()});
function observeSansala(){sansalaObserver.observe(document.body,{subtree:true,childList:true,characterData:true})}
paintSansala();observeSansala();
// Copying an invitation must copy the original Sinhala, never legacy key codes.
document.addEventListener('copy',event=>{
 if(document.activeElement.matches('input,textarea'))return;
 const selection=getSelection();if(!selection.rangeCount||!event.clipboardData)return;
 const copy=selection.getRangeAt(0).cloneContents();if(!copy.querySelector('.sansalaWord'))return;
 copy.querySelectorAll('.sansalaVisual').forEach(el=>el.remove());
 event.clipboardData.setData('text/plain',copy.textContent);event.preventDefault();
});
